name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Living Butterfly Sketch lives in its own repo. Every deploy takes its
      # current files and serves them at /artwork/living-butterfly/, so the
      # link always shows the latest version. The key is read-only.
      - uses: actions/checkout@v4
        with:
          repository: ambershen/super-duper-umbrella
          ssh-key: ${{ secrets.BUTTERFLY_DEPLOY_KEY }}
          path: .butterfly
      - run: |
          mkdir -p public/artwork/living-butterfly
          cp .butterfly/index.html .butterfly/sketch.js .butterfly/liquid.js .butterfly/species-data.js public/artwork/living-butterfly/
          rm -rf .butterfly
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
