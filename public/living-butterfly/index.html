<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Living Butterfly Sketch</title>
  <style>
    html, body { margin: 0; height: 100%; background: #020206; overflow: hidden; }
    canvas { display: block; position: fixed; left: 0; top: 0; }
    #liquid { z-index: 0; }
    main canvas { z-index: 1; }
    #caption {
      position: fixed; left: 24px; bottom: 20px; z-index: 2;
      font: 12px/1.6 ui-monospace, "SF Mono", Menlo, monospace;
      letter-spacing: 0.08em; color: rgba(255, 255, 255, 0.45);
      pointer-events: none; user-select: none;
      transition: opacity 2s;
    }
    #caption.hidden { opacity: 0; }
    #species { color: rgba(255, 255, 255, 0.85); text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="caption">
    <div id="species"></div>
    <div>click: mutate &nbsp;·&nbsp; d: dissolve &nbsp;·&nbsp; p: pin &nbsp;·&nbsp; space: wings &nbsp;·&nbsp; l: liquid &nbsp;·&nbsp; s: save</div>
    <div>staging &nbsp; arrows: move &nbsp;·&nbsp; + −: size &nbsp;·&nbsp; [ ]: gap &nbsp;·&nbsp; 0: reset &nbsp;·&nbsp; f: fullscreen &nbsp;·&nbsp; h: hide this</div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="liquid.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
