<style>
:root { --ink: #151513; --etch: rgba(20,20,18,0.72); --osd: #8CFF7A; --amber: #FFD34D; --red: #B8332A; --ground: #7FA7C9;

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--ground); color: #fff; font-family: var(--font-narrow); overflow: hidden; -webkit-font-smoothing: antialiased; }
#stage-wrap { position: fixed; inset: 0; }
#stage { position: absolute; left: 0; top: 0; width: 1440px; height: 808px; overflow: hidden; transform-origin: 0 0; background: var(--ground); }
.scene { position: absolute; inset: 0; transform-origin: 796px 400px; transition: transform 1.1s cubic-bezier(.65,0,.2,1); will-change: transform; }
.scene.zoomed { transform: translate(-53px, 20px) scale(1.5); }
.scene.mono { filter: grayscale(1); }

@keyframes jit { 0%{transform:translate(0,0)} 20%{transform:translate(1px,-1px)} 40%{transform:translate(-1px,1px)} 60%{transform:translate(1px,1px)} 80%{transform:translate(-1px,0)} 100%{transform:translate(0,0)} }
.scene.zoomed.jitter { animation: none; }
.tv { position: absolute; inset: 0; width: 1440px; height: 808px; object-fit: cover; display: block; user-select: none; -webkit-user-drag: none; }

.screen { position: absolute; left: 358px; top: 158px; width: 639px; height: 483px; border-radius: 34px / 38px; overflow: hidden; cursor: pointer; transition: filter .4s; }
.screen.mono { filter: grayscale(1) contrast(1.1); backdrop-filter: grayscale(1) contrast(1.1); -webkit-backdrop-filter: grayscale(1) contrast(1.1); }
.inner { position: absolute; left: 4px; top: 0; width: 336px; height: 257px; transform-origin: 0 0; transform: scale(1.88); }
.scan { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.16) 2px 3px); mix-blend-mode: multiply; }
.glass { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(115deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.04) 30%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.18) 100%); box-shadow: inset 0 0 26px rgba(0,0,0,0.55); }
.osd, .osd2 { position: absolute; right: 12px; font-family: var(--font-osd); line-height: 1; color: var(--osd); text-shadow: 0 0 2px #000, 0 0 6px rgba(140,255,122,0.9), 1px 0 0 rgba(255,0,0,0.35), -1px 0 0 rgba(0,120,255,0.35); pointer-events: none; }
.osd { top: 8px; font-size: 18px; } .osd2 { top: 30px; font-size: 16px; }
.ch { position: absolute; inset: 0; }
.static { position: absolute; inset: 0; background-color: #888; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.4' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 1 0'/><feComponentTransfer><feFuncR type='discrete' tableValues='0 1'/><feFuncG type='discrete' tableValues='0 1'/><feFuncB type='discrete' tableValues='0 1'/></feComponentTransfer></filter><rect width='160' height='160' filter='url(%23n)'/></svg>"); animation: snow .18s steps(3) infinite; }
@keyframes snow { 0%{background-position:0 0} 33%{background-position:60px 90px} 66%{background-position:-40px 30px} 100%{background-position:0 0} }
.off { position: absolute; inset: 0; background: #050505; display: flex; align-items: center; justify-content: center; }
.off-dot { width: 4px; height: 4px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px 2px rgba(255,255,255,0.8); animation: dot 1.6s ease-out forwards; }
@keyframes dot { 0%{transform:scaleX(80) scaleY(.6);opacity:1} 40%{transform:scale(1);opacity:1} 100%{transform:scale(0);opacity:0} }

.pip { position: absolute; right: 12px; top: 30px; width: 64px; height: 80px; object-fit: cover; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
.lower3 { position: absolute; left: 0; right: 0; bottom: 34px; padding: 8px 14px 8px 18px; background: linear-gradient(90deg, rgba(10,18,32,0.9) 0 60%, rgba(10,18,32,0)); border-left: 4px solid var(--red); }
.l3-name { font-family: var(--font-serif); font-style: italic; font-size: 26px; line-height: 1; }
.l3-sub { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: #E7EEF7; margin-top: 3px; }
.ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 22px; background: var(--red); display: flex; align-items: center; overflow: hidden; white-space: nowrap; font-size: 12px; }
.ticker span { display: inline-block; padding-left: 100%; animation: tick 26s linear infinite; }
@keyframes tick { to { transform: translateX(-100%); } }
.ch5 { background: linear-gradient(180deg, rgba(10,18,32,0.38), rgba(10,18,32,0.8)); }
.wx-head { display: flex; justify-content: space-between; padding: 10px 70px 0 14px; font-size: 9px; text-transform: uppercase; letter-spacing: .16em; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
.wx-main { position: absolute; left: 14px; top: 46px; display: flex; align-items: flex-start; gap: 12px; }
.wx-temp { font-family: var(--font-serif); font-size: 78px; line-height: .85; letter-spacing: -.04em; text-shadow: 0 2px 10px rgba(0,0,0,0.45); }
.wx-cond { font-family: var(--font-serif); font-style: italic; font-size: 16px; line-height: 1.15; padding-top: 6px; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
.wx-days { position: absolute; left: 14px; right: 14px; bottom: 34px; display: flex; justify-content: space-between; }
.wx-d { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 9px; text-transform: uppercase; letter-spacing: .12em; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
.wx-i { font-family: var(--font-serif); font-style: italic; font-size: 15px; text-transform: none; letter-spacing: 0; }
.wx-foot { position: absolute; left: 14px; bottom: 12px; font-size: 9px; letter-spacing: .08em; color: #E7EEF7; }

.home, .pg, .guide { background: rgba(8,12,20,0.88); display: flex; flex-direction: column; }
.hm-head { display: flex; align-items: baseline; gap: 10px; padding: 10px 70px 6px 14px; }
.hm-live { font-size: 9px; font-weight: 600; letter-spacing: .14em; background: var(--red); padding: 2px 5px; align-self: center; }
.hm-title { font-family: var(--font-serif); font-style: italic; font-size: 22px; line-height: 1; }
.hm-count { margin-left: auto; font-family: var(--font-osd); font-size: 16px; color: var(--amber); }
.hm-list { display: flex; flex-direction: column; padding: 2px 14px; }
.hm-row { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 0 8px; padding: 6px 0; border-top: 1px solid rgba(255,255,255,0.12); cursor: pointer; }
.hm-row:hover { background: rgba(255,255,255,0.06); }

.hm-t { font-size: 13px; font-weight: 600; line-height: 1.15; }
.hm-d { font-size: 10px; line-height: 1.25; color: #C8D0DC; }
.hm-foot { margin-top: auto; padding: 6px 14px 8px; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--amber); border-top: 1px solid rgba(255,255,255,0.15); }
.pg-head { display: flex; justify-content: space-between; padding: 9px 70px 0 14px; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: #C8D0DC; }
.pg-back { cursor: pointer; } .pg-back:hover { color: var(--amber); } .pg-back::before { content: '◂ '; }
.pg-main { display: grid; grid-template-columns: minmax(0,1fr) 104px; gap: 12px; padding: 6px 14px 0; flex: 1; min-height: 0; }
.pg-text { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.pg-title { font-family: var(--font-serif); font-style: italic; font-size: 24px; line-height: .95; }
.pg-sub { font-size: 11px; font-weight: 600; line-height: 1.25; color: #FFE1B8; }
.pg-body { font-size: 10px; line-height: 1.3; color: #C8D0DC; }
.pg-item { display: flex; justify-content: space-between; gap: 8px; font-size: 10px; line-height: 1.25; border-top: 1px solid rgba(255,255,255,0.12); padding-top: 3px; }
.pg-im { color: #9FB4CC; white-space: nowrap; }
.pg-links { margin-top: auto; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.pg-link { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--amber); text-decoration: none; }
.pg-link:hover { color: #fff; text-decoration: underline; text-underline-offset: 2px; }
.pg-media { position: relative; width: 104px; height: 100%; min-height: 150px; overflow: hidden; background: #101418; }
.pg-media img, .pg-media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pg-tile { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-osd); font-size: 30px; color: var(--osd); }

.pg-foot { display: flex; justify-content: space-between; padding: 5px 14px 7px; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--amber); border-top: 1px solid rgba(255,255,255,0.15); }
.slide { opacity: 0; animation: slides 16s infinite; }
.slide:nth-child(2){animation-delay:4s} .slide:nth-child(3){animation-delay:8s} .slide:nth-child(4){animation-delay:12s}
@keyframes slides { 0%{opacity:0} 6%{opacity:1} 25%{opacity:1} 31%{opacity:0} 100%{opacity:0} }
/* programme guide (the spare round button) */
.gd-head { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 70px 4px 14px; }
.gd-title { font-family: var(--font-serif); font-style: italic; font-size: 20px; line-height: 1; }
.gd-now { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: #C8D0DC; }
.gd-grid { display: grid; grid-template-columns: 74px minmax(0,1fr); padding: 0 14px; flex: 1; min-height: 0; }
.gd-ch { display: contents; }
.gd-name { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; padding: 6px 6px 6px 0; border-top: 1px solid rgba(255,255,255,0.12); cursor: pointer; display: flex; gap: 6px; align-items: baseline; }
.gd-name:hover { color: var(--amber); } .gd-name.on { color: var(--osd); }
.gd-n { font-family: var(--font-osd); font-size: 14px; color: var(--osd); }
.gd-progs { display: flex; gap: 2px; flex-wrap: wrap; padding: 6px 0; border-top: 1px solid rgba(255,255,255,0.12); }
.gd-p { font-size: 9px; line-height: 1; padding: 4px 6px; background: rgba(255,255,255,0.07); cursor: pointer; white-space: nowrap; }
.gd-p:hover { background: rgba(255,255,255,0.16); } .gd-p.on { background: var(--red); }
.gd-foot { padding: 5px 14px 7px; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--amber); border-top: 1px solid rgba(255,255,255,0.15); }

/* ---- controls: crops of the photograph ---- */
.pb, .rk, .knob { position: absolute; background-image: var(--tv); background-repeat: no-repeat; background-size: 1440px 808px; }
.pb { cursor: pointer; border-radius: 2px; transition: transform .09s ease-out, filter .09s ease-out, box-shadow .09s ease-out; will-change: transform; }
.pb:hover { filter: brightness(1.06); }
.pb:active { transform: translateY(1px) scale(0.985); filter: brightness(0.84); box-shadow: inset 0 1px 2px rgba(0,0,0,0.45); }
.pb.on { transform: translateY(1px) scale(0.99); filter: brightness(0.88); box-shadow: inset 0 1px 3px rgba(0,0,0,0.5); }
.pb.on:active { transform: translateY(1.5px) scale(0.98); }
.pb.round { border-radius: 50%; } .pb.round:active { transform: translateY(1px) scale(0.94); }
.rk { cursor: pointer; border-radius: 3px; transition: transform .16s cubic-bezier(.3,1.3,.5,1), filter .16s; }
.rk:hover { filter: brightness(1.08); }
.rk.on { transform: scaleY(-1); filter: brightness(0.9); }
.knob { border-radius: 50%; cursor: grab; transition: transform .45s cubic-bezier(.3,1.4,.5,1), filter .1s; box-shadow: 0 0 0 1px rgba(0,0,0,0.25); }
.knob:hover { filter: brightness(1.08); } .knob:active { filter: brightness(0.9); cursor: grabbing; }
.etch { position: absolute; font-size: 8px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; line-height: 1; pointer-events: none; white-space: nowrap; color: var(--etch); transition: color .15s, text-shadow .15s; }
.etch.c { text-align: center; }
.etch.lit { color: #fff; text-shadow: 0 0 6px rgba(255,255,255,0.9), 0 0 1px #000; }
.dial-n { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; display: flex; align-items: center; justify-content: center; font-family: var(--font-osd); font-size: 13px; line-height: 1; cursor: pointer; border-radius: 50%; color: var(--ink); }
.dial-n:hover { background: rgba(255,255,255,0.25); }
.dial-n.on { color: var(--osd); text-shadow: 0 0 6px rgba(140,255,122,0.9); }
.dim { position: absolute; inset: 0; background: rgba(2,6,20,0.62); pointer-events: none; opacity: 0; transition: opacity .8s; }
.glow { position: absolute; left: 358px; top: 158px; width: 639px; height: 483px; pointer-events: none; box-shadow: 0 0 60px 30px rgba(190,220,255,0.35); border-radius: 30px; opacity: 0; transition: opacity .8s; }
.scene.night .dim, .scene.night .glow { opacity: 1; }
.word { position: absolute; left: 40px; top: 28px; font-family: var(--font-serif); font-style: italic; font-size: 30px; line-height: 1; color: #fff; text-decoration: none; text-shadow: 0 1px 2px rgba(0,20,40,0.9), 0 0 12px rgba(0,20,40,0.5); }
.word small { display: block; font-family: var(--font-narrow); font-style: normal; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; margin-top: 6px; }
.hint { position: absolute; right: 40px; bottom: 28px; text-align: right; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #fff; line-height: 1.8; text-shadow: 0 1px 2px rgba(0,20,40,0.9), 0 0 10px rgba(0,20,40,0.6); opacity: .85; }

/* mobile remote */
.remote { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 0 14px 14px; background: linear-gradient(180deg, #C9C3AA 0%, #A9A38A 60%, #8F8A74 100%); border-top: 1px solid rgba(255,255,255,0.55); box-shadow: 0 -8px 30px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.5); transform: translateY(calc(100% - 30px)); transition: transform .45s cubic-bezier(.3,1,.3,1); color: var(--ink); }
body.portrait .remote { display: block; } .remote.open { transform: translateY(0); }
.rm-handle { height: 30px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: rgba(20,20,18,0.7); cursor: pointer; }
.rm-handle::before { content: ""; width: 34px; height: 4px; border-radius: 2px; background: rgba(20,20,18,0.35); }
.rm-row { display: grid; gap: 8px; margin-top: 8px; } .rm-row.six { grid-template-columns: repeat(6, minmax(0,1fr)); } .rm-row.four { grid-template-columns: repeat(4, minmax(0,1fr)); }
.rm-key { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
.rm-cap { width: 100%; height: 34px; border-radius: 4px; background: linear-gradient(180deg, #F2EFE4 0%, #CFCAB4 55%, #B3AD95 100%); box-shadow: 0 2px 0 #6E6A58, 0 3px 4px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; font-family: var(--font-osd); font-size: 18px; line-height: 1; color: var(--ink); transition: transform .08s, box-shadow .08s, filter .08s; }
.rm-key:active .rm-cap, .rm-key.on .rm-cap { transform: translateY(2px); box-shadow: 0 0 0 #6E6A58, 0 1px 2px rgba(0,0,0,0.35), inset 0 1px 3px rgba(0,0,0,0.35); filter: brightness(0.92); }
.rm-key.on .rm-cap { color: #2E7D32; text-shadow: 0 0 6px rgba(140,255,122,0.9); }
.rm-key.red .rm-cap { background: linear-gradient(180deg, #E8564A 0%, #C0392B 60%, #9B2A1F 100%); color: #fff; box-shadow: 0 2px 0 #5A140D, 0 3px 4px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.35); }
.rm-key.red.on .rm-cap { color: #FFE1B8; text-shadow: none; }
.rm-lab { font-size: 8px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--etch); line-height: 1; white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .scene, .knob, .pb, .rk { transition: none; } .static, .ticker span, .slide { animation-duration: .01s; } .scene.jitter { animation: none; } }

/* ---- The Persistence of Taste: programme pages are full-bleed live pictures ---- */
.show { position: absolute; inset: 0; background: #0B0E14; }
.show canvas { position: absolute; inset: 0; width: 336px; height: 257px; display: block; }

.cap-t { font-family: var(--font-serif); font-style: italic; font-size: 24px; line-height: 1; }
.cap-m { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: #E7EEF7; margin-top: 4px; }

.words { position: absolute; inset: 0; background: #0E1016; padding: 14px 70px 34px 18px; display: flex; flex-direction: column; }
.words-k { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: #9FB4CC; }
.words-t { font-family: var(--font-serif); font-style: italic; font-size: 22px; line-height: 1; margin: 4px 0 8px; }

.sig { position: absolute; left: 14px; top: 10px; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: #E7EEF7; text-shadow: 0 1px 3px rgba(0,0,0,0.7); }
.wx2 { background: #0B0E14; }

.cap-links { display: flex; gap: 12px; margin-top: 6px; }
.back { display: inline-flex; align-items: center; padding: 3px 7px; border: 1px solid rgba(255,255,255,0.4); border-radius: 2px; color: #fff; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; pointer-events: auto; background: rgba(8,12,20,0.45); }
.back:hover { color: var(--amber); border-color: var(--amber); }
.sig { display: flex; align-items: center; gap: 8px; }
.sig-p { text-shadow: 0 1px 3px rgba(0,0,0,0.7); }
.words-k { display: flex; align-items: center; gap: 6px; }
.hm-head .back { align-self: center; margin-right: 2px; }
.gd-head .back { align-self: center; }
.cap-d { max-width: 178px; }
.cap-nav { max-width: 120px; white-space: normal; }

.eye { position: absolute; overflow: hidden; clip-path: ellipse(49.5% 49% at 50% 51%); background: radial-gradient(ellipse at 50% 62%, #E9D8CC 0%, #DCC6B7 55%, #B89F91 100%); box-shadow: inset 0 7px 9px -5px rgba(60,35,25,0.65), inset 0 -3px 5px -3px rgba(60,35,25,0.35); pointer-events: none; }
.iris { position: absolute; left: 50%; top: 50%; width: 42px; height: 42px; margin: -21px 0 0 -21px; border-radius: 50%; background-image: var(--tv); background-repeat: no-repeat; background-size: 1440px 808px; box-shadow: 0 0 0 1px rgba(90,40,30,0.25); will-change: transform; }

<body>

  for (let k = 1; k <= 6; k++) { const x = GRID.cols[(k - 1) % 3], y = GRID.rows[Math.floor((k - 1) / 3)]; c.push(crop('pb', x - GRID.w / 2, y, GRID.w, GRID.h, `data-prog="${k}" data-k="p${k}"`)); c.push(etch(x - 16, y + 25, String(k), 32, 'p' + k)); }
  [['list', 'list'], ['dali', 'dalí'], ['shuffle', 'random']].forEach(([act, lab], i) => { const x = GRID.cols[i], y = GRID.rows[2]; c.push(crop('pb', x - GRID.w / 2, y, GRID.w, GRID.h, `data-act="${act}" data-k="${act}"`)); c.push(etch(x - 16, y + 25, lab, 32, act)); });
  c.push(crop('knob', BASE_KNOB.x - BASE_KNOB.r, BASE_KNOB.y - BASE_KNOB.r, BASE_KNOB.r * 2, BASE_KNOB.r * 2, 'data-act="fine" data-k="fine" title="Fine tune"'));
  stage.innerHTML = `<div class="scene" id="scene"><img src="${TV}" alt="" class="tv" draggable="false">
    <div class="eye" style="left:566px;top:262px;width:84px;height:42px;"><div class="iris" id="irisL" style="background-position:-584px -266px;"></div></div>
    <div class="eye" style="left:755px;top:265px;width:83px;height:37px;"><div class="iris" id="irisR" style="background-position:-777px -264px;"></div></div><div class="dim"></div><div class="glow"></div>
    <div class="screen" id="screen" data-act="zoom"><div class="inner" id="inner"></div><div class="scan"></div><div class="glass"></div><div class="osd" id="osd"></div><div class="osd2" id="osd2"></div></div>
    ${c.join('\n')}
    <div class="word">The Persistence of Taste<small>a television · five channels · all evening</small></div>
    <div class="hint">turn the dial · press the keys · lean in<br>1–6 · ↑↓ · ←→ · G · esc</div></div>`;
  scene = document.getElementById('scene'); buildRemote();
}
const remote = document.createElement('div'); remote.className = 'remote'; document.body.appendChild(remote);
const rkey = (attrs, cap, lab, extra = '') => `<div class="rm-key ${extra}" ${attrs}><div class="rm-cap">${cap}</div><div class="rm-lab">${lab}</div></div>`;
function buildRemote() { const chNames = ['dalí', 'cinema', 'songs', 'built', 'fashion', 'furnished']; remote.innerHTML = `<div class="rm-handle" data-rm="toggle">remote</div><div class="rm-row six">${DIAL_STOPS.map((st, i) => rkey(`data-stop="${i}"`, st.label, chNames[i])).join('')}</div><div class="rm-row six">${[1, 2, 3, 4, 5, 6].map((k) => rkey(`data-prog="${k}"`, String(k), k === 1 ? 'programme' : '&nbsp;')).join('')}</div><div class="rm-row four">${rkey('data-act="list"', '≡', 'list')}${rkey('data-act="rockUp"', '▲', 'prev')}${rkey('data-act="rockDown"', '▼', 'next')}${rkey('data-act="guide"', '▦', 'guide')}</div><div class="rm-row six">${rkey('data-act="power"', 'PWR', '&nbsp;', 'red')}${rkey('data-act="mute"', 'MUTE', '&nbsp;', 'red')}${rkey('data-act="zoom"', 'LEAN', '&nbsp;', 'red')}${rkey('data-act="color"', 'C', 'color')}${rkey('data-act="night"', 'N', 'night')}${rkey('data-act="mono"', 'M', 'mono')}</div>`; }
let remoteOpen = false; function setRemote(o) { remoteOpen = o; remote.classList.toggle('open', o); fit(); }

// ================= what's on the screen =================
function guideHTML() {
  const rows = [1, 2, 3, 4, 5].map((n) => { const c = CHANNELS[n]; return `<div class="gd-ch"><div class="gd-name ${state.ch === n ? 'on' : ''}" data-stop="${n}"><span class="gd-n">${n}</span>${esc(c.name)}</div><div class="gd-progs">${c.progs.length ? c.progs.map((p, i) => `<span class="gd-p ${state.ch === n && state.prog === i + 1 ? 'on' : ''}" data-goto="${n}/${i + 1}">${i + 1} ${esc(p.title)}</span>`).join('') : '<span class="gd-p" data-stop="' + n + '">live</span>'}</div></div>`; }).join('');
  return `<div class="ch guide"><div class="gd-head"><span class="gd-title">Programme guide</span><span class="back" data-act="guide">close ▸</span></div><div class="gd-grid">${rows}</div><div class="gd-foot">a channel is a subject · a programme is a work or a maker · guide again to close</div></div>`;
}
function screenHTML() {
  const { ch, prog, on, stat } = state;
  if (!on) return '<div class="off"><div class="off-dot"></div></div>';
  if (stat) return '<div class="static"></div>';
  if (state.guide) return guideHTML();
  if (ch === 0) return '';
  const chan = CHANNELS[ch], list = chan.progs, n = list.length;
  if (prog === 0) return `<div class="ch home"><div class="hm-head"><span class="back" data-act="guide">◂ guide</span><span class="hm-live">LIVE</span><span class="hm-title">${esc(chan.name)}</span><span class="hm-count">${n} programmes</span></div><div class="hm-list">${list.map((p, i) => `<div class="hm-row" data-prog="${i + 1}"><span class="hm-n">${i + 1}</span><span class="hm-t">${esc(p.title)}</span><span class="hm-d">${esc(p.short)} · ${esc(p.meta)}</span></div>`).join('')}</div><div class="hm-foot">${ch === 2 ? 'sound on · original loops in each song’s spirit · links open the real thing' : `press 1–${n} · ▲▼ · list brings you back`}</div></div>`;
  const p = list[prog - 1], nav = `<div class="cap-nav">${prog > 1 ? '▲ ' + esc(list[prog - 2].title) + '<br>' : ''}${prog < n ? esc(list[prog].title) + ' ▼' : 'list · back'}</div>`;
  if (p.scene === 'text') return `<div class="ch words"><span class="words-k"><span class="back" data-act="list">◂ ${esc(chan.name)}</span> · ${esc(p.meta)}</span><div class="words-t">${esc(p.title)}</div><div class="words-b">${esc(p.text)}</div><div class="words-f">${prog < n ? esc(list[prog].title) + ' ▼' : 'list · back'}</div></div>`;
  return `<div class="ch show"><canvas id="pic" width="${W * 2}" height="${Hh * 2}"></canvas><span class="sig"><span class="back" data-act="list">◂ ${esc(chan.name)}</span><span class="sig-p">P ${prog}/${n}</span></span><div class="cap"><div class="cap-t">${esc(p.title)}</div><div class="cap-m">${esc(p.meta)}</div><div class="cap-d">${esc(p.desc)}</div>${p.links ? `<div class="cap-links">${p.links.map((l) => `<a class="pg-link" href="${l.href}" target="_blank" rel="noopener noreferrer">${esc(l.label)}</a>`).join("")}</div>` : ""}</div>${nav}</div>`;
}
// animation: one loop, draws whichever picture is on
let t0 = performance.now();
function loop(now) { const cv = document.getElementById('pic'); if (cv && state.on && !state.stat) { const p = progs(state.ch)[state.prog - 1]; const fn = p && SCENES[p.scene]; if (fn) { const ctx = cv.getContext('2d'); ctx.setTransform(2, 0, 0, 2, 0, 0); fn(ctx, (now - t0) / 1000); post(ctx); } } requestAnimationFrame(loop); }
requestAnimationFrame(loop);

let lastKey = '';
function render() {
  const { ch, prog, on, stat, zoomed } = state, n = progs(ch).length, live = on && !stat;
  const key = `${ch}|${prog}|${on}|${stat}|${state.guide}`;
  if (key !== lastKey) { document.getElementById('inner').innerHTML = screenHTML(); lastKey = key; }
  scene.classList.toggle('zoomed', zoomed); scene.classList.toggle('night', state.night); scene.classList.toggle('mono', state.mono);
  document.getElementById('screen').classList.toggle('mono', !state.color);
  const bars = '▮'.repeat(state.vol / 2) + '▯'.repeat(5 - state.vol / 2);
  document.getElementById('osd').textContent = on ? (ch === 0 ? 'CH ··' : `CH ${String(ch).padStart(2, '0')}`) : '';
  document.getElementById('osd2').textContent = !on ? '' : state.muted ? 'MUTE' : state.showVol ? `VOL ${bars}` : state.guide ? 'GUIDE' : prog ? `P ${prog}/${n}` : '';
  const knobs = stage.querySelectorAll('.knob');
  knobs[0].style.transform = `rotate(${DIAL_STOPS[ch].deg - POINTER_DEG}deg)`; knobs[1].style.transform = `rotate(${-120 + state.vol * 24 - POINTER_DEG}deg)`; knobs[2].style.transform = `rotate(${state.tune * 37}deg)`;
  stage.querySelectorAll('.dial-n').forEach((el, i) => el.classList.toggle('on', on && ch === i));
  const onFor = { power: on, mute: state.muted, zoom: zoomed, color: !state.color, night: state.night, mono: state.mono, guide: state.guide, list: live && prog === 0 && n > 0 && !state.guide, dali: live && ch === 0, shuffle: false, rockUp: false, rockDown: false };
  document.querySelectorAll('[data-act]').forEach((el) => { const a = el.dataset.act; if (a in onFor && (el.classList.contains('pb') || el.classList.contains('rk') || el.classList.contains('rm-key'))) el.classList.toggle('on', onFor[a]); });
  document.querySelectorAll('.pb[data-prog], .rm-key[data-prog]').forEach((el) => el.classList.toggle('on', live && prog === Number(el.dataset.prog)));
  remote.querySelectorAll('[data-stop]').forEach((el) => el.classList.toggle('on', on && ch === Number(el.dataset.stop)));
  writeHash();
  audioSync();
}
const ACTIONS = { nextChannel: () => tune(state.ch >= 5 ? 0 : state.ch + 1), vol: () => bumpVol(), power: togglePower, mute: () => set({ muted: !state.muted, showVol: false }), zoom: () => { set({ zoomed: !state.zoomed }); fit(); }, color: () => set({ color: !state.color }), night: () => set({ night: !state.night }), mono: () => set({ mono: !state.mono }), rockUp: () => rock(-1), rockDown: () => rock(1), list: goList, dali: () => pressChannel(0), shuffle, guide: toggleGuide, fine: fineTune };
function onTap(e) { const t = e.target; audioInit(); if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume(); if (t.closest('a')) return; if (t.closest('[data-rm="toggle"]')) { setRemote(!remoteOpen); return; }
  const go = t.closest('[data-goto]'); if (go) { const [c, k] = go.dataset.goto.split('/').map(Number); click(); flash({ ch: c, prog: k }, 300); return; }
  const stop = t.closest('[data-stop]'); if (stop) { click('knob'); pressChannel(Number(stop.dataset.stop)); return; }
  const pe = t.closest('[data-prog]'); if (pe) { click(); pressProg(Number(pe.dataset.prog)); return; }
  const ae = t.closest('[data-act]'); if (ae && ACTIONS[ae.dataset.act]) { click(ae.classList.contains('rk') ? 'switch' : ae.classList.contains('knob') ? 'knob' : 'key'); ACTIONS[ae.dataset.act](); } }
stage.addEventListener('click', onTap); remote.addEventListener('click', onTap);
stage.addEventListener('mouseover', (e) => { const el = e.target.closest('[data-k]'); if (!el) return; const lab = stage.querySelector(`.etch[data-lab="${el.dataset.k}"]`); if (lab) lab.classList.add('lit'); });
stage.addEventListener('mouseout', (e) => { const el = e.target.closest('[data-k]'); if (!el) return; const lab = stage.querySelector(`.etch[data-lab="${el.dataset.k}"]`); if (lab) lab.classList.remove('lit'); });
let wheelLock = 0;
stage.addEventListener('wheel', (e) => { const k = e.target.closest('[data-wheel]'); if (!k) return; e.preventDefault(); const now = Date.now(); if (now - wheelLock < 160) return; wheelLock = now; const dir = e.deltaY > 0 ? 1 : -1; click('knob'); if (k.dataset.wheel === 'channel') pressChannel((state.ch + dir + 6) % 6); else bumpVol(dir * 2); }, { passive: false });
window.addEventListener('keydown', (e) => { if (e.metaKey || e.ctrlKey || e.altKey) return; audioInit(); if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume(); if (e.key >= '1' && e.key <= '6') pressProg(Number(e.key)); else if (e.key === 'ArrowUp') rock(-1); else if (e.key === 'ArrowDown') rock(1); else if (e.key === 'ArrowRight') pressChannel((state.ch + 1) % 6); else if (e.key === 'ArrowLeft') pressChannel((state.ch + 5) % 6); else if (e.key === 'Escape') { if (state.guide) set({ guide: false }); else if (state.zoomed) { set({ zoomed: false }); fit(); } } else if (e.key === 'g' || e.key === 'G') toggleGuide(); });
const PORTRAIT = () => window.innerWidth < 760 && window.innerWidth < window.innerHeight;
function fit() { const vw = window.innerWidth, vh = window.innerHeight, portrait = PORTRAIT(); document.body.classList.toggle('portrait', portrait);
  if (portrait && state.zoomed) { const room = vh - (remoteOpen ? remote.offsetHeight : 30), s = Math.min(vw / 990, room / 760); stage.style.transform = `scale(${s})`; stage.style.marginLeft = `${vw / 2 - 565 * s}px`; stage.style.marginTop = `${room / 2 - 419 * s}px`; return; }
  const s = Math.min(vw / 1440, vh / 808); stage.style.transform = `scale(${s})`; stage.style.marginLeft = `${(vw - 1440 * s) / 2}px`; stage.style.marginTop = `${(vh - 808 * s) / 2}px`; }
buildStage(); readHash(); if (PORTRAIT()) { state.zoomed = true; setTimeout(() => setRemote(true), 700); } fit(); render();
window.addEventListener('resize', fit); window.addEventListener('hashchange', () => { readHash(); render(); });

// ================= the man watches you back =================
const irises = () => [document.getElementById('irisL'), document.getElementById('irisR')];
const gaze = { x: 0, y: 0, tx: 0, ty: 0, last: 0, idle: true };
window.addEventListener('mousemove', (e) => {
  const eyes = document.querySelectorAll('.eye'); if (!eyes.length) return;
  let sx = 0, sy = 0; eyes.forEach((el) => { const r = el.getBoundingClientRect(); sx += e.clientX - (r.left + r.width / 2); sy += e.clientY - (r.top + r.height / 2); });
  const range = Math.max(240, window.innerWidth * 0.3);
  gaze.tx = Math.max(-1, Math.min(1, sx / 2 / range)); gaze.ty = Math.max(-1, Math.min(1, sy / 2 / (range * 0.7)));
  gaze.last = performance.now(); gaze.idle = false;
});
(function look(now) {
  if (now - gaze.last > 2600) { gaze.idle = true; gaze.tx = Math.sin(now / 2300) * 0.55 + Math.sin(now / 5100) * 0.25; gaze.ty = Math.sin(now / 3700) * 0.35; }   // left alone, he wanders
  gaze.x += (gaze.tx - gaze.x) * (gaze.idle ? 0.03 : 0.18); gaze.y += (gaze.ty - gaze.y) * (gaze.idle ? 0.03 : 0.18);
  irises().forEach((el) => { if (el) el.style.transform = `translate(${(gaze.x * 9).toFixed(2)}px, ${(gaze.y * 3.5).toFixed(2)}px)`; });
  requestAnimationFrame(look);
})(performance.now());

</script>
