  <main id="home-page">
    <span id="state" class="sr-only" aria-live="polite">Preparing specimen</span>
    <div class="intro">
      <button id="intro-toggle" class="mobile-only" type="button" aria-expanded="false">Read introduction</button>
      <h1>Hi, I’m Amber.<br>I like making things <button class="word" data-mode="bloom" title="A breeze through the petals" disabled>bloom</button>.</h1>
      <div id="chapter-two" class="chapter" hidden>
        <p class="story">Somewhere between <button class="word" data-mode="art" title="Brush the flower into fragments" aria-pressed="false" disabled>art</button>, <button class="word" data-mode="narrative" title="Draw the flower in pencil" aria-pressed="false" disabled>narrative</button>, <button class="word" data-mode="code" title="Float the petals and let them return" aria-pressed="false" disabled>code</button>, and a little <button class="word" data-mode="chaos" title="Let the petals fall to find me" aria-pressed="false" disabled>chaos</button>.</p>
      </div>
      <div id="chapter-three" class="chapter" hidden>
        <p class="story">I turn curious ideas into things you can <button class="word" id="play" title="Wipe the mist from my portrait" aria-pressed="false">play with</button>.</p>
        <p class="story social-story">You can find me on <a class="word" href="https://x.com/whosamberella" target="_blank" rel="noopener noreferrer">X</a>, <a class="word" href="https://instagram.com/whosamberella" target="_blank" rel="noopener noreferrer">Instagram</a>, <a class="word" href="https://www.youtube.com/@whosamberella" target="_blank" rel="noopener noreferrer">YouTube</a>, <a class="word" href="https://github.com/ambershen" target="_blank" rel="noopener noreferrer">GitHub</a>, or just browse some of <button class="word" data-open-work="products">my work</button>.</p>
      </div>
    </div>
    <div id="mobile-reading"></div>
    <canvas id="flower" aria-label="Interactive flower. Brush or drag across petals to release them as falling pixels. Use the words in the introduction to change the flower’s appearance."></canvas>
    <div class="mobile-tools mobile-only"><span id="touch-hint">Tap bloom to begin</span><button id="mobile-reset" type="button" disabled>Reset ↺</button></div>
    <div id="loading" role="status">Growing your flower…</div>
  </main>
  <section id="work-window" class="collection-page" aria-labelledby="work-title" hidden>
    <div class="work-heading"><h2 id="work-title" tabindex="-1">Selected work</h2><p id="work-description"></p></div>
    <div id="work-content"></div>
