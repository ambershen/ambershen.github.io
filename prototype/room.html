<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>amber's room — prototype</title>
<style>
  :root {
    --ink: #0A0A0C;
    --cream: #F2EDE7;
    --plum: #82667F;
    --slate: #2C3E5C;
    --rasp: #D14A61;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--ink); }
  body { font-family: Georgia, 'Times New Roman', serif; }
  canvas { display: block; }

  #wordmark {
    position: fixed; top: 28px; left: 32px;
    color: var(--cream); opacity: 0.55; font-size: 17px;
    letter-spacing: 0.06em; pointer-events: none; z-index: 5;
  }
  #hint {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
    color: var(--cream); opacity: 0.3; font-size: 13px; font-style: italic;
    pointer-events: none; z-index: 5; transition: opacity 1.2s;
  }
  #sound-toggle {
    position: fixed; top: 24px; right: 28px; z-index: 6;
    background: none; border: 1px solid rgba(242,237,231,0.25);
    color: var(--cream); opacity: 0.6; font-family: inherit;
    font-size: 13px; padding: 7px 16px; border-radius: 999px;
    cursor: pointer; transition: opacity 0.3s, border-color 0.3s;
  }
  #sound-toggle:hover { opacity: 1; border-color: var(--rasp); }

  #label {
    position: fixed; pointer-events: none; z-index: 6;
    color: var(--cream); font-size: 15px; font-style: italic;
    opacity: 0; transition: opacity 0.25s;
    text-shadow: 0 1px 8px rgba(10,10,12,0.9);
  }

  #overlay {
    position: fixed; inset: 0; z-index: 10;
    background: var(--cream); color: var(--ink);
    display: none; opacity: 0; transition: opacity 0.6s;
    padding: clamp(32px, 8vw, 96px);
    overflow-y: auto;
  }
  #overlay.visible { opacity: 1; }
  #overlay h1 { font-size: clamp(36px, 6vw, 64px); font-weight: normal; font-style: italic; margin-bottom: 24px; }
  #overlay p { font-size: 17px; line-height: 1.7; max-width: 560px; font-family: 'Helvetica Neue', Arial, sans-serif; color: #333; }
  #back {
    display: inline-block; margin-bottom: 48px;
    background: none; border: none; cursor: pointer;
    font-family: inherit; font-size: 15px; color: var(--ink);
    border-bottom: 1px solid var(--rasp); padding-bottom: 2px;
  }
  #back:hover { color: var(--rasp); }
</style>
</head>
<body>
<div id="wordmark">amber shen</div>
<div id="hint">move through the dark — the room responds</div>
<button id="sound-toggle">sound off</button>
<div id="label"></div>

<div id="overlay">
  <button id="back">&larr; back to the room</button>
  <h1 id="overlay-title"></h1>
  <p id="overlay-body"></p>
</div>

<script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const INK = 0x0A0A0C, CREAM = 0xF2EDE7, PLUM = 0x82667F, SLATE = 0x2C3E5C, RASP = 0xD14A61;
const WALL_L = 0x14181f, WALL_R = 0x10141a, FLOOR = 0x161f2e, SLATE_D = 0x1e2b42;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(INK);
scene.fog = new THREE.Fog(INK, 12, 26);

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 60);
const CAM_HOME = new THREE.Vector3(7.6, 6.4, 7.6);
const TGT_HOME = new THREE.Vector3(0, 0.9, 0);
camera.position.copy(CAM_HOME);
camera.lookAt(TGT_HOME);

const mat = (color, opts = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0.05, ...opts });

const floor = new THREE.Mesh(new THREE.BoxGeometry(6.6, 0.2, 6.6), mat(FLOOR));
floor.position.y = -0.1;
floor.receiveShadow = true;
scene.add(floor);

const wallL = new THREE.Mesh(new THREE.BoxGeometry(0.16, 3.4, 6.6), mat(WALL_L));
wallL.position.set(-3.3, 1.7, 0);
wallL.receiveShadow = true;
scene.add(wallL);

const wallB = new THREE.Mesh(new THREE.BoxGeometry(6.6, 3.4, 0.16), mat(WALL_R));
wallB.position.set(0, 1.7, -3.3);
wallB.receiveShadow = true;
scene.add(wallB);

const winGlow = new THREE.Mesh(
  new THREE.PlaneGeometry(1.5, 1.7),
  new THREE.MeshBasicMaterial({ color: 0xE8E9EF })
);
winGlow.rotation.y = Math.PI / 2;
winGlow.position.set(-3.21, 2.0, -1.1);
scene.add(winGlow);
const mullV = new THREE.Mesh(new THREE.BoxGeometry(0.02, 1.7, 0.07), mat(INK));
mullV.position.set(-3.2, 2.0, -1.1);
scene.add(mullV);
const mullH = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.07, 1.5), mat(INK));
mullH.position.set(-3.2, 2.0, -1.1);
scene.add(mullH);

scene.add(new THREE.AmbientLight(0x2a3345, 1.1));
const moon = new THREE.SpotLight(0xcfd6e8, 55, 30, 0.5, 0.6, 1.4);
moon.position.set(-7.5, 4.6, -1.1);
moon.target.position.set(1.2, 0, 0.2);
moon.castShadow = true;
moon.shadow.mapSize.set(1024, 1024);
moon.shadow.bias = -0.002;
scene.add(moon, moon.target);

const sections = [];
function makeSection(name, group, focus) {
  group.userData = { section: name };
  group.traverse(m => { if (m.isMesh) { m.castShadow = true; m.userData.baseEmissive = m.material.emissive ? m.material.emissive.clone() : null; } });
  group.userData.focus = focus;
  sections.push(group);
  scene.add(group);
  return group;
}

/* ---- about: standing mirror ---- */
{
  const g = new THREE.Group();
  const frame = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.045, 12, 48), mat(0xd8d2c8, { roughness: 0.5 }));
  frame.scale.y = 1.35;
  frame.position.y = 1.15;
  const glass = new THREE.Mesh(new THREE.CircleGeometry(0.4, 40), mat(0x232e42, { roughness: 0.15, metalness: 0.85 }));
  glass.scale.y = 1.35;
  glass.position.y = 1.15;
  const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.75), mat(0xd8d2c8));
  legL.position.set(-0.28, 0.36, 0.12); legL.rotation.z = 0.25; legL.rotation.x = -0.18;
  const legR = legL.clone(); legR.position.x = 0.28; legR.rotation.z = -0.25;
  g.add(frame, glass, legL, legR);
  g.position.set(-0.7, 0, -2.5);
  g.rotation.y = 0.5;
  makeSection('about', g, { pos: [1.4, 1.7, -0.4], tgt: [-0.7, 1.1, -2.5] });
}

/* ---- art: easel with eye canvas ---- */
{
  const g = new THREE.Group();
  const legGeo = new THREE.CylinderGeometry(0.028, 0.028, 1.7);
  const legMat = mat(0x8a93a5);
  const l1 = new THREE.Mesh(legGeo, legMat); l1.position.set(-0.35, 0.83, 0.06); l1.rotation.z = 0.2;
  const l2 = new THREE.Mesh(legGeo, legMat); l2.position.set(0.35, 0.83, 0.06); l2.rotation.z = -0.2;
  const l3 = new THREE.Mesh(legGeo, legMat); l3.position.set(0, 0.83, -0.34); l3.rotation.x = 0.3;
  const cnv = document.createElement('canvas');
  cnv.width = cnv.height = 512;
  const c = cnv.getContext('2d');
  c.fillStyle = '#82667F'; c.fillRect(0, 0, 512, 512);
  c.fillStyle = '#0A0A0C';
  c.beginPath(); c.ellipse(256, 256, 170, 96, -0.15, 0, 7); c.fill();
  c.fillStyle = '#F2EDE7';
  c.beginPath(); c.arc(256, 250, 52, 0, 7); c.fill();
  c.fillStyle = '#0A0A0C';
  c.beginPath(); c.arc(256, 250, 20, 0, 7); c.fill();
  const tex = new THREE.CanvasTexture(cnv);
  const canvas = new THREE.Mesh(
    new THREE.BoxGeometry(0.92, 1.1, 0.05),
    [mat(PLUM), mat(PLUM), mat(PLUM), mat(PLUM), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 }), mat(PLUM)]
  );
  canvas.position.set(0, 1.15, 0.12);
  canvas.rotation.x = -0.12;
  g.add(l1, l2, l3, canvas);
  g.position.set(1.9, 0, -1.7);
  g.rotation.y = -0.35;
  makeSection('art', g, { pos: [3.4, 1.9, 0.9], tgt: [1.9, 1.15, -1.7] });
}

/* ---- writings: desk, paper, lamp ---- */
let lampLight;
{
  const g = new THREE.Group();
  const top = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.09, 0.85), mat(SLATE));
  top.position.y = 0.78;
  const legGeo = new THREE.BoxGeometry(0.07, 0.78, 0.07);
  const legMat = mat(SLATE_D);
  [[-0.77, -0.35], [0.77, -0.35], [-0.77, 0.35], [0.77, 0.35]].forEach(([x, z]) => {
    const leg = new THREE.Mesh(legGeo, legMat);
    leg.position.set(x, 0.39, z);
    g.add(leg);
  });
  const paper = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.46), mat(CREAM, { roughness: 1 }));
  paper.rotation.x = -Math.PI / 2;
  paper.rotation.z = 0.2;
  paper.position.set(0.1, 0.83, 0.05);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 0.05), mat(SLATE_D));
  base.position.set(-0.6, 0.85, -0.2);
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.5), mat(SLATE_D));
  arm.position.set(-0.55, 1.08, -0.15); arm.rotation.z = -0.3;
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 12),
    new THREE.MeshStandardMaterial({ color: 0xf5e6c4, emissive: 0xf2dfae, emissiveIntensity: 1.6 }));
  bulb.position.set(-0.44, 1.3, -0.1);
  lampLight = new THREE.PointLight(0xf2dfae, 5.5, 4.2, 1.6);
  lampLight.position.set(-0.44, 1.32, -0.1);
  lampLight.castShadow = true;
  g.add(top, paper, base, arm, bulb, lampLight);
  g.position.set(-2.3, 0, -0.3);
  g.rotation.y = Math.PI / 2;
  makeSection('writings', g, { pos: [-0.1, 1.9, 1.5], tgt: [-2.3, 0.85, -0.3] });
}

/* ---- projects: wall shelf with small objects ---- */
{
  const g = new THREE.Group();
  const plank = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.07, 0.45), mat(SLATE));
  plank.position.set(0, 0, 0);
  const cube = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.22, 0.22), mat(PLUM));
  cube.position.set(-0.65, 0.15, 0); cube.rotation.y = 0.5;
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.3, 5), mat(CREAM, { roughness: 0.7 }));
  cone.position.set(-0.15, 0.19, 0.04);
  const orb = new THREE.Mesh(new THREE.SphereGeometry(0.12, 20, 14), mat(PLUM, { roughness: 0.4 }));
  orb.position.set(0.32, 0.16, -0.03);
  const arch = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.045, 10, 24, Math.PI), mat(0x8a93a5));
  arch.position.set(0.75, 0.08, 0);
  g.add(plank, cube, cone, orb, arch);
  g.position.set(0.9, 1.95, -3.05);
  makeSection('projects', g, { pos: [1.1, 2.15, -0.7], tgt: [0.9, 2.05, -3.05] });
}

/* ---- connect: pulsing phone on a stool ---- */
let phoneBody, phoneLight;
{
  const g = new THREE.Group();
  const seat = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.34, 0.07, 20), mat(SLATE_D));
  seat.position.y = 0.55;
  const legGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.55);
  for (let i = 0; i < 3; i++) {
    const a = i * Math.PI * 2 / 3;
    const leg = new THREE.Mesh(legGeo, mat(SLATE_D));
    leg.position.set(Math.cos(a) * 0.2, 0.27, Math.sin(a) * 0.2);
    leg.rotation.z = Math.cos(a) * 0.15;
    leg.rotation.x = -Math.sin(a) * 0.15;
    g.add(leg);
  }
  phoneBody = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.16, 0.24),
    new THREE.MeshStandardMaterial({ color: RASP, emissive: RASP, emissiveIntensity: 0.35, roughness: 0.5 }));
  phoneBody.position.y = 0.665;
  const handset = new THREE.Mesh(new THREE.CapsuleGeometry(0.045, 0.26, 6, 12),
    new THREE.MeshStandardMaterial({ color: RASP, emissive: RASP, emissiveIntensity: 0.35, roughness: 0.5 }));
  handset.rotation.z = Math.PI / 2;
  handset.position.y = 0.79;
  phoneLight = new THREE.PointLight(RASP, 1.2, 2.6, 1.8);
  phoneLight.position.y = 0.9;
  g.add(seat, phoneBody, handset, phoneLight);
  g.position.set(2.2, 0, 1.5);
  makeSection('connect', g, { pos: [3.7, 1.4, 3.3], tgt: [2.2, 0.7, 1.5] });
}

/* ---- radio: diegetic sound toggle ---- */
const radio = new THREE.Group();
{
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.24, 0.18), mat(SLATE));
  body.position.y = 0.12;
  const dial = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.03, 16), mat(CREAM));
  dial.rotation.x = Math.PI / 2;
  dial.position.set(0.1, 0.14, 0.1);
  const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.4), mat(0x8a93a5));
  antenna.position.set(-0.15, 0.4, 0);
  antenna.rotation.z = 0.35;
  radio.add(body, dial, antenna);
  radio.position.set(-2.7, 0, -2.6);
  radio.userData = { section: 'radio' };
  radio.traverse(m => { if (m.isMesh) m.castShadow = true; });
  scene.add(radio);
}

/* ---- dust motes ---- */
const dustGeo = new THREE.BufferGeometry();
const dustN = 130;
const dustPos = new Float32Array(dustN * 3);
for (let i = 0; i < dustN; i++) {
  dustPos[i * 3] = (Math.random() - 0.5) * 6;
  dustPos[i * 3 + 1] = Math.random() * 3;
  dustPos[i * 3 + 2] = (Math.random() - 0.5) * 6;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: CREAM, size: 0.02, transparent: true, opacity: 0.35, depthWrite: false
}));
scene.add(dust);

/* ================= interaction ================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(-2, -2);
const labelEl = document.getElementById('label');
const RASP_COL = new THREE.Color(RASP);
let hovered = null;
let entered = null;
let camTween = null;
const curTgt = TGT_HOME.clone();

addEventListener('pointermove', e => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  labelEl.style.left = (e.clientX + 18) + 'px';
  labelEl.style.top = (e.clientY - 8) + 'px';
});

function setHover(group) {
  if (hovered === group) return;
  if (hovered) hovered.traverse(m => {
    if (m.isMesh && m.userData.baseEmissive) {
      const mats = Array.isArray(m.material) ? m.material : [m.material];
      mats.forEach(mm => mm.emissive && mm.emissive.copy(m.userData.baseEmissive));
    }
  });
  hovered = group;
  if (group && group.userData.section !== 'radio') {
    group.traverse(m => {
      if (m.isMesh && m.userData.baseEmissive) {
        const mats = Array.isArray(m.material) ? m.material : [m.material];
        mats.forEach(mm => {
          if (mm.emissive && mm.emissive.getHex() !== RASP) mm.emissive.lerpColors(m.userData.baseEmissive, RASP_COL, 0.28);
        });
      }
    });
  }
  labelEl.textContent = group ? group.userData.section : '';
  labelEl.style.opacity = group ? 1 : 0;
  labelEl.style.color = group && group.userData.section === 'connect' ? '#D14A61' : '#F2EDE7';
  document.body.style.cursor = group ? 'pointer' : 'default';
  soloLayer(group && group.userData.section);
}

function tweenCamera(toPos, toTgt, dur = 1.4) {
  camTween = {
    fromPos: camera.position.clone(), toPos: new THREE.Vector3(...toPos),
    fromTgt: curTgt.clone(), toTgt: new THREE.Vector3(...toTgt),
    t: 0, dur
  };
}

const overlay = document.getElementById('overlay');
const overlayCopy = {
  about: ['about', 'Who I am, where I have been, and what I care about. (Placeholder — this page inherits the minimal rule: ink on cream, nothing else.)'],
  art: ['art', 'How I see the world. Photography, sketches, and experiments in seeing. (Placeholder.)'],
  writings: ['writings', 'Essays and notes, written under this lamp. (Placeholder.)'],
  projects: ['projects', 'Things I have built, kept on this shelf. (Placeholder.)'],
  connect: ['connect', 'The phone is always on. Email, socials, and everything else. (Placeholder.)']
};

function enterSection(name) {
  const g = sections.find(s => s.userData.section === name);
  if (!g) return;
  entered = name;
  document.getElementById('hint').style.opacity = 0;
  tweenCamera(g.userData.focus.pos, g.userData.focus.tgt, 1.5);
  setTimeout(() => {
    if (entered !== name) return;
    const [title, body] = overlayCopy[name];
    document.getElementById('overlay-title').textContent = title;
    document.getElementById('overlay-body').textContent = body;
    overlay.style.display = 'block';
    requestAnimationFrame(() => overlay.classList.add('visible'));
  }, 1250);
}

function leaveSection() {
  entered = null;
  overlay.classList.remove('visible');
  setTimeout(() => { overlay.style.display = 'none'; }, 600);
  tweenCamera(CAM_HOME.toArray(), TGT_HOME.toArray(), 1.3);
}

document.getElementById('back').addEventListener('click', leaveSection);
addEventListener('keydown', e => { if (e.key === 'Escape' && entered) leaveSection(); });

addEventListener('click', () => {
  if (entered) return;
  if (hovered) {
    if (hovered.userData.section === 'radio') toggleSound();
    else enterSection(hovered.userData.section);
  }
});

/* ================= generative ambient (Tone.js) ================= */
let soundOn = false, audioBuilt = false;
const layers = {};
const toggleBtn = document.getElementById('sound-toggle');

function buildAudio() {
  const master = new Tone.Volume(-8).toDestination();
  const rev = new Tone.Reverb({ decay: 6, wet: 0.45 }).connect(master);

  const mk = (node, base) => {
    const vol = new Tone.Volume(base).connect(rev);
    node.connect(vol);
    return { node, vol, base };
  };

  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: 'sine' },
    envelope: { attack: 3.5, decay: 2, sustain: 0.6, release: 5 }
  });
  layers.about = mk(pad, -22);
  new Tone.Loop(t => {
    const chords = [['D3', 'A3', 'F4'], ['C3', 'G3', 'E4'], ['A2', 'E3', 'C4']];
    pad.triggerAttackRelease(chords[Math.floor(Math.random() * 3)], 7, t);
  }, 9).start(0);

  const pluck = new Tone.Synth({ oscillator: { type: 'triangle' }, envelope: { attack: 0.005, decay: 0.4, sustain: 0, release: 0.6 } });
  layers.art = mk(pluck, -20);
  const penta = ['D4', 'F4', 'G4', 'A4', 'C5', 'D5'];
  new Tone.Loop(t => {
    if (Math.random() < 0.65) pluck.triggerAttackRelease(penta[Math.floor(Math.random() * penta.length)], 0.5, t);
  }, 1.8).start(0.7);

  const tick = new Tone.NoiseSynth({ noise: { type: 'brown' }, envelope: { attack: 0.001, decay: 0.05, sustain: 0 } });
  layers.writings = mk(tick, -26);
  new Tone.Loop(t => {
    if (Math.random() < 0.4) tick.triggerAttackRelease(0.05, t);
    if (Math.random() < 0.2) tick.triggerAttackRelease(0.05, t + 0.13);
  }, 0.6).start(0.2);

  const box = new Tone.Synth({ oscillator: { type: 'sine' }, envelope: { attack: 0.002, decay: 1.2, sustain: 0, release: 1.5 } });
  layers.projects = mk(box, -22);
  const hi = ['A5', 'C6', 'E6', 'G5'];
  new Tone.Loop(t => {
    if (Math.random() < 0.45) box.triggerAttackRelease(hi[Math.floor(Math.random() * hi.length)], 1.5, t);
  }, 3.2).start(1.4);

  const hum = new Tone.Oscillator('A1', 'sine').start();
  const humLfo = new Tone.LFO(0.1, -34, -28).start();
  layers.connect = mk(hum, -30);
  humLfo.connect(layers.connect.vol.volume);

  audioBuilt = true;
}

function soloLayer(name) {
  if (!soundOn || !audioBuilt) return;
  Object.entries(layers).forEach(([k, l]) => {
    l.vol.volume.rampTo(k === name ? l.base + 10 : l.base, 0.8);
  });
}

async function toggleSound() {
  if (!soundOn) {
    await Tone.start();
    if (!audioBuilt) buildAudio();
    Tone.Transport.start();
    Tone.Destination.mute = false;
    soundOn = true;
    toggleBtn.textContent = 'sound on';
    toggleBtn.style.borderColor = '#D14A61';
  } else {
    Tone.Destination.mute = true;
    soundOn = false;
    toggleBtn.textContent = 'sound off';
    toggleBtn.style.borderColor = 'rgba(242,237,231,0.25)';
  }
}
toggleBtn.addEventListener('click', toggleSound);

/* ================= render loop ================= */
const clock = new THREE.Clock();

function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  phoneBody.material.emissiveIntensity = 0.35 + 0.22 * Math.sin(t * 2.1);
  phoneLight.intensity = 1.0 + 0.5 * Math.sin(t * 2.1);
  lampLight.intensity = 5.5 + 0.35 * Math.sin(t * 9.3) * Math.sin(t * 1.7);

  const dp = dust.geometry.attributes.position;
  for (let i = 0; i < dustN; i++) {
    let y = dp.getY(i) + 0.0012 + 0.0008 * Math.sin(t + i);
    if (y > 3.2) y = 0;
    dp.setY(i, y);
    dp.setX(i, dp.getX(i) + 0.0006 * Math.sin(t * 0.4 + i * 2.1));
  }
  dp.needsUpdate = true;

  if (camTween) {
    camTween.t += (dt || 0.016) / camTween.dur;
    const k = ease(Math.min(camTween.t, 1));
    camera.position.lerpVectors(camTween.fromPos, camTween.toPos, k);
    curTgt.lerpVectors(camTween.fromTgt, camTween.toTgt, k);
    if (camTween.t >= 1) camTween = null;
  } else if (!entered) {
    const px = pointer.x * 0.45, py = pointer.y * 0.3;
    camera.position.x += (CAM_HOME.x + px - camera.position.x) * 0.04;
    camera.position.y += (CAM_HOME.y + py - camera.position.y) * 0.04;
    camera.position.z += (CAM_HOME.z + px * 0.5 - camera.position.z) * 0.04;
  }
  camera.lookAt(curTgt);

  if (!entered && !camTween) {
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects([...sections, radio], true);
    let g = null;
    if (hits.length) {
      let o = hits[0].object;
      while (o && !o.userData.section) o = o.parent;
      g = o;
    }
    setHover(g);
  } else if (hovered) setHover(null);

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
